project:
  name: AsyncMysql
  version: "1.0.0"

database:
  type: mysql
  database_name: async_mysql.db
  async_mode: true

entities:
  - name: Widget
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: label, type: string}

services:
  - name: widgets
    entities: [Widget]
