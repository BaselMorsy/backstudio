project:
  name: BuiltinInviteEmailVerification
  version: "1.0.0"
  description: Invite flow combined with email_verification registration mode, to prove an invited user is not double-gated

database:
  type: sqlite
  database_name: builtin_invite_email_verification.db

auth:
  enabled: true
  jwt:
    secret_env_var: JWT_SECRET
    algorithm: HS256
  registration:
    mode: email_verification
  invite:
    enabled: true

rbac:
  enabled: true
  roles: [admin, member]

entities:
  - name: Widget
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: label, type: string}

services:
  - name: widgets
    entities: [Widget]
