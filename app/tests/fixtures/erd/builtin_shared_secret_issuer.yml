project:
  name: BuiltinSharedSecretIssuer

database:
  type: sqlite
  database_name: builtin_shared_secret_issuer.db

auth:
  enabled: true
  jwt:
    secret_env_var: JWT_SECRET
    issuer: authservice
    audience: external-shared-secret

rbac:
  enabled: true
  roles: [admin]
  default_permissions:
    create: [admin]
    list: [admin]
    read: [admin]
    update: [admin]
    delete: [admin]

entities:
  - name: Widget
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: label, type: string}

services:
  - name: widgets
    entities: [Widget]
