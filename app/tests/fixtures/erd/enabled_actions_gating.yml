project:
  name: ActionGating
  version: "1.0.0"

database:
  type: sqlite
  database_name: action_gating.db

entities:
  - name: Archive
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: title, type: string}
    endpoints:
      enabled: [list, read]

  - name: Sealed
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: note, type: string}
    endpoints:
      enabled: []

  - name: Note
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: body, type: string}
    relationships:
      - {name: archive, cardinality: many-to-one, target: Archive}

services:
  - name: records
    entities: [Archive, Sealed, Note]
