project:
  name: ExternalSharedSecret

database:
  type: sqlite
  database_name: external_shared_secret.db

auth:
  enabled: true
  mode: external
  external:
    verification: shared_secret
    secret_env_var: SHARED_SECRET
    issuer: authservice
    algorithms: [HS256]

rbac:
  enabled: true
  roles: [admin]
  default_permissions:
    create: [admin]
    list: [admin]
    read: [admin]
    update: [admin]
    delete: [admin]

entities:
  - name: Widget
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: label, type: string}

services:
  - name: widgets
    entities: [Widget]
