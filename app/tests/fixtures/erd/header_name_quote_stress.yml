project:
  name: HeaderNameQuoteStress
  version: "1.0.0"

database:
  type: sqlite
  database_name: header_name_quote_stress.db

entities:
  - name: Tenant
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: name, type: string}

  - name: Order
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: status, type: string, default: pending}
    relationships:
      - {name: tenant, cardinality: many-to-one, target: Tenant, owner: true}
    rls:
      identity_source:
        type: header
        header_name: 'X-Ten"ant'

services:
  - name: tenants
    entities: [Tenant]
  - name: orders
    entities: [Order]
