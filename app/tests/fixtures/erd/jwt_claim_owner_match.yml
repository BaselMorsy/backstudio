project:
  name: JwtClaimOwnerMatch
  version: "1.0.0"

database:
  type: sqlite
  database_name: jwt_claim_owner_match.db

auth:
  enabled: true
  mode: external
  external:
    jwks_url_env_var: AUTH_JWKS_URL
    issuer: authservice
    audience: jwt-claim-owner-match

rbac:
  enabled: true
  roles: [admin]
  default_permissions:
    read: [admin]

entities:
  - name: Agency
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: agency_ref, type: uuid, unique: true}

  - name: Project
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: name, type: string}
    relationships:
      - {name: agency, cardinality: many-to-one, target: Agency, owner: true}
    rls:
      identity_source: {type: jwt_claim, claim: agency_id}
      owner_match_field: agency_ref

  - name: Task
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: title, type: string}
    relationships:
      - {name: project, cardinality: many-to-one, target: Project, cascades_ownership: true}

services:
  - name: agencies
    entities: [Agency]
  - name: projects
    entities: [Project, Task]
