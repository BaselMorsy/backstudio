project:
  name: RlsCascadeComposability
  version: "1.0.0"

database:
  type: sqlite
  database_name: rls_cascade_composability.db

auth:
  enabled: true

entities:
  - name: Product
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: name, type: string}

  - name: Order
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: status, type: string, default: pending}
    relationships:
      - {name: user, cardinality: many-to-one, target: User, owner: true}
    rls:
      identity_source:
        type: auth_user

  - name: OrderItem
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: quantity, type: integer, default: 1}
    relationships:
      - {name: order, cardinality: many-to-one, target: Order, cascades_ownership: true}
      - {name: product, cardinality: many-to-one, target: Product}

services:
  - name: catalog
    entities: [Product]
  - name: ordering
    entities: [Order, OrderItem]
