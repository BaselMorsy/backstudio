project:
  name: RlsHeaderBypassRoles
  version: "1.0.0"

database:
  type: sqlite
  database_name: rls_header_bypass_roles.db

auth:
  enabled: true

rbac:
  enabled: true
  roles: [admin, customer]
  default_permissions:
    create: [admin, customer]
    list: [admin, customer]
    read: [admin, customer]
    update: [admin, customer]
    delete: [admin, customer]

entities:
  - name: Tenant
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: name, type: string}

  - name: Order
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: status, type: string, default: pending}
    relationships:
      - {name: tenant, cardinality: many-to-one, target: Tenant, owner: true}
    rls:
      bypass_roles: [admin]
      identity_source:
        type: header
        header_name: X-Tenant-Id

services:
  - name: tenants
    entities: [Tenant]
  - name: orders
    entities: [Order]
