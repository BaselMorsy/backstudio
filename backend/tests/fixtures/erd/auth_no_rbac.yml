project:
  name: AuthNoRbac
  version: "1.0.0"

database:
  type: sqlite
  database_name: auth_no_rbac.db

auth:
  enabled: true
  jwt:
    secret_env_var: AUTHNORBAC_JWT_SECRET

entities:
  - name: Note
    fields:
      - {name: id, type: integer, primary_key: true}
      - {name: body, type: string}

services:
  - name: notes
    entities: [Note]
