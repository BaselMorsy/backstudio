<svg width="110" height="110" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .symbol {
        fill: none;
        stroke: #c8a951;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: miter;
      }
      .slash {
        fill: none;
        stroke: #f5f1e8;
        stroke-width: 4;
        stroke-linecap: round;
      }
      .bracket {
        fill: none;
        stroke: #c8a951;
        stroke-width: 4;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="110" height="110" fill="#0f2a1f" rx="8"/>

  <!-- Logo Group (centered at 60, 60) -->
  <g transform="translate(60, 60)">

    <!-- LEFT CURLY BRACKET { -->
    <path d="M -45,-25 Q -50,-25 -50,-20 L -50,-8 Q -50,-3 -54,0 Q -50,3 -50,8 L -50,20 Q -50,25 -45,25" class="bracket" />

    <!-- THE "B" SYMBOL (|>>) - centered at -24 -->
    <g transform="translate(-35, 0)">
      <line x1="0" y1="-20" x2="0" y2="20" class="symbol" />
      <polyline points="8,-16 18,-10 8,-4" class="symbol" />
      <polyline points="8,4 18,10 8,16" class="symbol" />
    </g>

    <!-- SLASH "/" - perfectly centered -->
    <line x1="-5" y1="20" x2="5" y2="-20" class="slash" />

    <!-- THE "S" SYMBOL (< >) - centered at +24, mirrored from B -->
    <g transform="translate(35, 0)">
      <polyline points="-8,-16 -18,-10 -8,-4" class="symbol" />
      <polyline points="-18,4 -8,10 -18,16" class="symbol" />
    </g>

    <!-- RIGHT CURLY BRACKET } -->
    <path d="M 35,-25 Q 40,-25 40,-20 L 40,-8 Q 40,-3 44,0 Q 40,3 40,8 L 40,20 Q 40,25 35,25" class="bracket" />

  </g>
</svg>
