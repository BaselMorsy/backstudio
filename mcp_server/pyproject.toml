[project]
name = "backstudio-mcp-server"
version = "0.1.0"
description = "MCP Server for BackStudio - Generate FastAPI backends through natural language"
authors = [
    {name = "BackStudio Team"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backstudio_mcp"]
