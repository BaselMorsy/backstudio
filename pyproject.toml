[project]
name = "backstudio"
version = "0.1.0"
description = "BackStudio - The Ultimate Backend Code Generator"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "jinja2==3.1.2",
    "python-multipart==0.0.6",
    "typer==0.9.0",
    "click>=8.1,<8.2",
    "pyyaml==6.0.1",
    "passlib[bcrypt]==1.7.4",
    # Pinned explicitly: passlib 1.7.4 misdetects bcrypt>=4.1 (removed
    # bcrypt.__about__), which breaks hash_password() at runtime. Generated
    # projects' requirements.txt already pins this; pin it here too so the
    # dev/test environment matches (needed by
    # backend/tests/test_generated_project_runtime.py, which actually hashes
    # a password through the generated auth service).
    "bcrypt==4.0.1",
    "python-jose[cryptography]==3.3.0",
    "alembic==1.13.0",
    "sqlalchemy==2.0.23",
    # Pinned explicitly (also in generated projects' requirements.txt): generated
    # config.py calls load_dotenv() directly so a project's own .env file actually
    # takes effect (see backend/templates/Python/config.py.jinja); needed here too
    # since backend/tests/test_generated_project_runtime.py imports and runs
    # generated code against this repo's own venv rather than a fresh install.
    "python-dotenv==1.2.1",
]

[project.scripts]
backstudio = "backend.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "httpx==0.25.2",
    # Needed at test time only: backend/tests/test_generated_project_runtime.py
    # actually imports and runs a generated project, whose auth/schemas.py
    # uses pydantic's EmailStr (requires the separate email-validator package).
    "email-validator==2.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.25.2",
    "email-validator>=2.1.1",
]
