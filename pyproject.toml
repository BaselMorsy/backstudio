[project]
name = "backstudio"
version = "2.0.0"
description = "BackStudio - The Ultimate Backend Code Generator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1.4",
    "typer>=0.12",
    "click>=8.1,<8.2",
    "pyyaml>=6.0.2",
    "passlib[bcrypt]==1.7.4",
    # Pinned explicitly: passlib 1.7.4 misdetects bcrypt>=4.1 (removed
    # bcrypt.__about__), which breaks hash_password() at runtime. Generated
    # projects' requirements.txt already pins this; pin it here too so the
    # dev/test environment matches (needed by
    # app/tests/test_generated_project_runtime.py, which actually hashes
    # a password through the generated auth service).
    "bcrypt==4.0.1",
    "python-jose[cryptography]==3.3.0",
    "alembic>=1.14",
    "sqlalchemy>=2.0.36",
    # Pinned explicitly rather than left to SQLAlchemy's own platform-gated dependency
    # marker: verified that marker (platform_machine == 'AMD64'/'aarch64'/'x86_64'/...)
    # doesn't match on Windows-on-ARM64 hosts running an x64-emulated Python 3.12
    # interpreter, because Python's own platform.machine() reports differently between
    # 3.11 and 3.12 builds on that exact host/architecture combination — greenlet
    # silently didn't install, breaking every async-mode test at runtime with
    # "the greenlet library is required to use this function." Declaring it directly
    # removes the dependency on that marker matching correctly across platforms/versions.
    "greenlet==3.5.5",
    # Pinned explicitly (also in generated projects' requirements.txt): generated
    # config.py calls load_dotenv() directly so a project's own .env file actually
    # takes effect (see app/templates/Python/config.py.jinja); needed here too
    # since app/tests/test_generated_project_runtime.py imports and runs
    # generated code against this repo's own venv rather than a fresh install.
    "python-dotenv==1.2.1",
]

[project.scripts]
backstudio = "app.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "httpx==0.25.2",
    # Needed at test time only: app/tests/test_generated_project_runtime.py
    # actually imports and runs a generated project, whose auth/schemas.py
    # uses pydantic's EmailStr (requires the separate email-validator package).
    "email-validator==2.1.1",
    "aiosqlite>=0.22.1",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "ruff>=0.17.3",
    "pytest-cov>=7.1.0",
    "mypy>=1.20",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.25.2",
    "email-validator>=2.1.1",
    "aiosqlite>=0.22.1",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "ruff>=0.17.3",
    "pytest-cov>=7.1.0",
    "mypy>=2.4.1",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["app/templates"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "W6", "I"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# pytest fixture imports look like redefinitions; tests use assert False / short names deliberately.
"app/tests/*" = ["F811", "B011", "E741", "E402", "B904"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/templates/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true


[tool.mypy]
python_version = "3.11"
files = ["app"]
exclude = ["app/templates/", "app/tests/"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
