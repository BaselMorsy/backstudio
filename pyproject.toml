[project]
name = "backstudio"
version = "0.1.0"
description = "BackStudio - The Ultimate Backend Code Generator"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "jinja2==3.1.2",
    "python-multipart==0.0.6",
    "typer==0.9.0",
    "click>=8.1,<8.2",
    "pyyaml==6.0.1",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "alembic==1.13.0",
    "sqlalchemy==2.0.23",
]

[project.scripts]
backstudio = "backend.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "httpx==0.25.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.25.2",
]
